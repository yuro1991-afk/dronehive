[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dronehive"
version = "1.0.0"
description = "Installable modular AI worker drone swarm (buzzer hive + fabric) with desktop app, CLI, and universal links"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "yuro1" }]
keywords = [
  "swarm",
  "drones",
  "ollama",
  "agents",
  "modular",
  "hive",
  "desktop",
  "ai",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Distributed Computing",
]
# Core: stdlib only. Desktop UI is an extra.
dependencies = []

[project.optional-dependencies]
desktop = ["customtkinter>=5.2.0"]
build = ["pyinstaller>=6.0", "customtkinter>=5.2.0", "build", "wheel"]
dev = ["customtkinter>=5.2.0", "pyinstaller>=6.0", "build", "wheel"]
all = ["customtkinter>=5.2.0"]

[project.urls]
Homepage = "https://github.com/yuro1991-afk/dronehive"
Documentation = "https://github.com/yuro1991-afk/dronehive#readme"
Repository = "https://github.com/yuro1991-afk/dronehive"
Issues = "https://github.com/yuro1991-afk/dronehive/issues"

[project.scripts]
dronehive = "drone.app.cli:main"
drone-hive = "drone.app.cli:main"
dronehive-desktop = "drone.app.desktop:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["drone*"]

[tool.setuptools.package-data]
drone = [
  "app/seed/configs/*.json",
  "app/seed/docs/*.md",
  "py.typed",
]
