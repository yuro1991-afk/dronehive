name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -e ".[desktop]"
      - name: Health
        run: python -m drone app health
      - name: Fast task
        run: python -m drone app task --goal "ci smoke" --lane fast --lm-assist none --controller local
      - name: Pro agent (no ollama)
        run: python -m drone app pro --goal "ci pro write ci_ok.txt" --rounds 3 --no-ollama
      - name: Work order show
        run: python -m drone work-order-show

  rust-tui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build dronehive-tui (release)
        working-directory: apps/dronehive-tui
        run: cargo build --release
      - name: TUI help
        run: .\apps\dronehive-tui\target\release\dronehive-tui.exe --help
      - name: Upload TUI binary
        uses: actions/upload-artifact@v4
        with:
          name: dronehive-tui-windows
          path: apps/dronehive-tui/target/release/dronehive-tui.exe
