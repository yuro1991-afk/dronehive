[package]
name = "drone-ollama-app"
version = "1.0.0"
edition = "2021"
description = "Drone Ollama — top-tier installed workbench (Ollama + 24 worker drones)"
license = "MIT"
authors = ["Boss"]

[[bin]]
name = "drone-ollama-app"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
open = "5"

[profile.release]
lto = true
codegen-units = 1
strip = true
