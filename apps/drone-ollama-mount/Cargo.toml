[package]
name = "drone-ollama-mount"
version = "0.1.0"
edition = "2021"
description = "Rust engine: mount AI worker drones onto Ollama TUI"
license = "MIT"
authors = ["Boss"]

[[bin]]
name = "drone-ollama-mount"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
crossterm = "0.28"
ratatui = "0.29"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
