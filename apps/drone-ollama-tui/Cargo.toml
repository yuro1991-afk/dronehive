[package]
name = "drone-ollama-tui"
version = "1.0.0"
edition = "2021"
description = "Drone Ollama MAIN DELEGATE lean Rust TUI — same UX as dronehive-tui"
license = "MIT"

[[bin]]
name = "drone-ollama-tui"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"  # size — lean machine
